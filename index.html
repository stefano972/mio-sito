<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei Link</title>
    <style>
        /* Questo rende la pagina più carina e centrata */
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        h1 { color: #333; }
        .container { text-align: center; }
        
        /* Stile per i link (sembrano bottoni) */
        .link-button {
            display: block;
            width: 200px;
            margin: 10px auto;
            padding: 15px;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .link-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Benvenuti sul mio sito</h1>
        <p>Ecco i miei link preferiti:</p>

        <a href="https://www.google.it" class="link-button" target="_blank">Vai a Google</a>
        
        <a href="https://www.wikipedia.org" class="link-button" target="_blank">Vai a Wikipedia</a>
    </div>

</body>
</html>
